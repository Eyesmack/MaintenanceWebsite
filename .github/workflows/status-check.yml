name: Status Check

on:
  # GitHub's own scheduler delays/drops runs under global load, so a
  # Cloudflare Worker Cron Trigger is the primary driver: it calls the
  # workflow_dispatch API below every 5 minutes. This schedule stays as a
  # harmless fallback (dedupe via the auto-outage label makes double-firing
  # safe either way).
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check apps and manage outage issues
        env:
          # A PAT, not the default GITHUB_TOKEN — GitHub Actions never lets
          # an action performed with GITHUB_TOKEN trigger other workflows
          # (anti-recursion guard), so closing an issue here would silently
          # never fire summarize-incident.yml's `issues: closed` trigger.
          # A PAT isn't subject to that restriction. Needs Issues (read and
          # write) + Contents (read and write) permission on this repo.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # A transient 5xx from GitHub's own API (seen in practice as an
          # occasional 504 on api.github.com/graphql) shouldn't fail the
          # whole run — retry a gh call a few times with a short backoff
          # before giving up. curl's own --retry below covers the app
          # reachability checks; this covers every call to GitHub itself.
          gh_retry() {
            local attempt=1 max_attempts=3
            until "$@"; do
              if (( attempt >= max_attempts )); then
                return 1
              fi
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }

          # Consecutive failed checks required before an outage issue gets
          # filed — checks run every 1 minute, so a single blip shouldn't
          # alert. State (per-app consecutive-failure counts) has to live
          # somewhere across runs since each run starts fresh; rather than
          # Actions cache or committing a state file, this reuses the same
          # "GitHub Issues as the datastore" pattern as the rest of this
          # workflow: one hidden issue holds a JSON blob of counters. It
          # never carries an app-name label, so status.js never surfaces it.
          FAILURE_THRESHOLD=2
          STATE_LABEL="status-check-state"

          # auto-outage marks issues this workflow owns, so it never touches
          # manually-filed maintenance issues (which carry only the app label).
          gh_retry gh label create auto-outage --color d73a4a \
            --description "Automatically opened by the status-check workflow" --force >/dev/null 2>&1 || true
          gh_retry gh label create "$STATE_LABEL" --color 6a737d \
            --description "Internal bookkeeping for the status-check workflow — do not edit" --force >/dev/null 2>&1 || true

          state_issue_number=$(gh_retry gh issue list --repo "$GH_REPO" --label "$STATE_LABEL" --state open \
            --json number --jq '(.[0].number // "")')
          if [[ -z "$state_issue_number" ]]; then
            state_issue_url=$(gh_retry gh issue create --repo "$GH_REPO" \
              --title "Status Check Internal State (auto-managed — do not edit)" \
              --body '{}' --label "$STATE_LABEL")
            state_issue_number=$(basename "$state_issue_url")
          fi

          state_json=$(gh_retry gh issue view "$state_issue_number" --repo "$GH_REPO" --json body --jq '(.body // "{}")')
          echo "$state_json" | jq empty >/dev/null 2>&1 || state_json='{}'

          # Response-time samples are recorded once an hour (not every
          # 1-minute check) so the resulting git commits stay infrequent.
          # _lastLatencyHour piggybacks on the same state blob above rather
          # than needing a separate issue or file read on the other runs.
          current_hour=$(date -u +'%Y-%m-%dT%H')
          record_latency=false
          if [[ "$(echo "$state_json" | jq -r '._lastLatencyHour // ""')" != "$current_hour" ]]; then
            record_latency=true
            latency_json=$(cat data/latency-history.json 2>/dev/null || echo '{}')
            echo "$latency_json" | jq empty >/dev/null 2>&1 || latency_json='{}'
          fi

          # monitoring-start.json records, once, the first time each app is
          # ever seen here — read unconditionally (not hourly-gated like
          # latency above) so a newly added app in apps.json gets its start
          # date recorded within ~1 minute rather than waiting for the next
          # hourly window.
          monitoring_json=$(cat data/monitoring-start.json 2>/dev/null || echo '{}')
          echo "$monitoring_json" | jq empty >/dev/null 2>&1 || monitoring_json='{}'
          monitoring_changed=false

          # Pass 1: check every app's reachability and update fail-streak
          # state, but only *decide* what to do about outages/recoveries
          # here — the actual issue creation/closing happens in Pass 2
          # below, once every app's result for this run is known. This is
          # what lets multiple apps that go down together end up in one
          # shared issue, and a combined issue's apps recover independently
          # of each other, instead of each app being handled in isolation
          # as it's checked.
          recovered_json='[]'   # [{label, key, existing}] — apps back up this run with an open issue
          newly_down_json='[]'  # [{label, key, url, status}] — apps that just crossed FAILURE_THRESHOLD

          while IFS=$'\t' read -r key url; do
            # Labels are always lowercase regardless of how apps.json
            # capitalizes the app name, so this stays in sync with the page's
            # case-insensitive label matching no matter the casing used.
            label=$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')

            if [[ "$(echo "$monitoring_json" | jq -r --arg k "$key" 'has($k)')" == "false" ]]; then
              monitoring_json=$(echo "$monitoring_json" | jq --arg k "$key" --arg t "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" '.[$k] = $t')
              monitoring_changed=true
              echo "First time seeing $key — recording monitoring start date"
            fi

            gh_retry gh label create "$label" --color 5319e7 \
              --description "Status updates for $key" --force >/dev/null 2>&1 || true

            read -r status time_total <<< "$(curl -sL -A "GitHub-Actions-StatusCheck" -o /dev/null -w '%{http_code} %{time_total}' \
              --max-time 10 --retry 2 --retry-delay 2 "$url" || echo "000 0")"
            echo "$key ($url) -> HTTP $status (${time_total}s)"

            if [[ "$record_latency" == true ]]; then
              latency_ms=$(awk -v t="$time_total" 'BEGIN { printf "%.0f", t * 1000 }')
              latency_json=$(echo "$latency_json" | jq --arg k "$key" --arg t "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --argjson ms "$latency_ms" \
                '.[$k] = ((.[$k] // []) + [{t: $t, ms: $ms}])')
            fi

            existing=$(gh_retry gh issue list --repo "$GH_REPO" --label "$label,auto-outage" --state open \
              --json number --jq '(.[0].number // "")')

            if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
              # Any successful check resets the consecutive-failure streak,
              # so a future outage needs FAILURE_THRESHOLD fresh failures
              # again rather than picking up an old count.
              state_json=$(echo "$state_json" | jq --arg k "$label" '.[$k] = 0')

              if [[ -n "$existing" ]]; then
                recovered_json=$(echo "$recovered_json" | jq --arg l "$label" --arg k "$key" --argjson n "$existing" \
                  '. + [{label: $l, key: $k, existing: $n}]')
              fi
            else
              if [[ -n "$existing" ]]; then
                echo "Issue #$existing already open for $key, skipping"
              else
                fail_count=$(echo "$state_json" | jq -r --arg k "$label" '(.[$k] // 0) + 1')
                state_json=$(echo "$state_json" | jq --arg k "$label" --argjson c "$fail_count" '.[$k] = $c')

                if (( fail_count < FAILURE_THRESHOLD )); then
                  echo "$key down ($fail_count/$FAILURE_THRESHOLD consecutive failures) — not yet confirmed"
                else
                  # A planned-maintenance issue (app label + "update") can
                  # declare a Maintenance-Start/Maintenance-End window (NZ
                  # time) in its body; if now falls inside it, the app being
                  # down is expected, so skip creating an outage issue.
                  maintenance_body=$(gh_retry gh issue list --repo "$GH_REPO" --label "$label,update" --state open \
                    --json body --jq '(.[0].body // "")')

                  # grep exits 1 when there's no match (the normal case when
                  # no maintenance window is declared) — with pipefail + the
                  # shell's own -e, that would otherwise kill the whole job.
                  start_str=$(printf '%s' "$maintenance_body" | grep -oP '(?<=Maintenance-Start:\s)\d{4}-\d{2}-\d{2} \d{2}:\d{2}' | head -1 || true)
                  end_str=$(printf '%s' "$maintenance_body" | grep -oP '(?<=Maintenance-End:\s)\d{4}-\d{2}-\d{2} \d{2}:\d{2}' | head -1 || true)

                  in_window=false
                  if [[ -n "$start_str" && -n "$end_str" ]]; then
                    start_epoch=$(TZ='Pacific/Auckland' date -d "$start_str" +%s 2>/dev/null || echo "")
                    end_epoch=$(TZ='Pacific/Auckland' date -d "$end_str" +%s 2>/dev/null || echo "")
                    now_epoch=$(date -u +%s)
                    if [[ -n "$start_epoch" && -n "$end_epoch" && "$now_epoch" -ge "$start_epoch" && "$now_epoch" -le "$end_epoch" ]]; then
                      in_window=true
                    fi
                  fi

                  if [[ "$in_window" == true ]]; then
                    echo "$key is down but within an announced maintenance window, skipping"
                  else
                    newly_down_json=$(echo "$newly_down_json" | jq --arg l "$label" --arg k "$key" --arg u "$url" --arg s "$status" \
                      '. + [{label: $l, key: $k, url: $u, status: $s}]')
                    echo "$key crossed the failure threshold — queued for this run's outage issue"
                  fi
                fi
              fi
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' data/apps.json)

          # Pass 2a: recoveries, grouped by the issue they belong to
          # (several apps recovering this run can share the same combined
          # issue). Labels are never removed — see the comment on
          # newly_down_json's batching below for why: an app's downtime
          # history/uptime% is computed from an issue's *current* labels
          # every time the page fetches, so removing a label the moment
          # that app individually recovers would silently drop the
          # incident from its history. Instead, a recovered app's own end
          # time is recorded as a declared body line (same convention as
          # Maintenance-Start/End, Incident-Start), and the issue only
          # actually closes once every attached app has recovered.
          if [[ "$(echo "$recovered_json" | jq 'length')" -gt 0 ]]; then
            now_nz=$(TZ='Pacific/Auckland' date +'%Y-%m-%d %H:%M')
            now_str=$(date -u +'%Y-%m-%d %H:%M UTC')
            for issue_number in $(echo "$recovered_json" | jq -r '[.[].existing] | unique | .[]'); do
              recovered_for_issue=$(echo "$recovered_json" | jq --argjson n "$issue_number" '[.[] | select(.existing == $n)]')
              recovered_keys=$(echo "$recovered_for_issue" | jq -r '[.[].key] | join(", ")')
              recovered_labels_json=$(echo "$recovered_for_issue" | jq '[.[].label]')

              current_labels=$(gh_retry gh issue view "$issue_number" --repo "$GH_REPO" --json labels --jq '[.labels[].name | ascii_downcase]')
              remaining_labels=$(jq -n --argjson current "$current_labels" --argjson recovered "$recovered_labels_json" \
                '($current - ["auto-outage"]) - $recovered')

              if [[ "$(echo "$remaining_labels" | jq 'length')" -eq 0 ]]; then
                # Every app attached to this issue has now recovered.
                # Apps recovering in this final batch don't need their own
                # Recovered-<label> marker — closed_at already correctly
                # represents their end time too. Any app that recovered in
                # an earlier partial batch already has its own marker from
                # back then, untouched here.
                gh_retry gh issue close "$issue_number" --repo "$GH_REPO" \
                  --comment "Recovered — $recovered_keys responded normally at $now_str."
                echo "Closed issue #$issue_number ($recovered_keys recovered)"
              else
                current_body=$(gh_retry gh issue view "$issue_number" --repo "$GH_REPO" --json body --jq '(.body // "")')
                recovery_lines=$(echo "$recovered_for_issue" | jq -r --arg t "$now_nz" '.[] | "Recovered-\(.label): \($t)"')
                new_body=$(printf '%s\n\n%s' "$current_body" "$recovery_lines")

                gh_retry gh issue edit "$issue_number" --repo "$GH_REPO" --body "$new_body"
                gh_retry gh issue comment "$issue_number" --repo "$GH_REPO" \
                  --body "✅ $recovered_keys recovered at $now_str. Still monitoring the rest."
                echo "Recorded recovery for $recovered_keys on issue #$issue_number (others still down)"
              fi
            done
          fi

          # Pass 2b: apps that crossed the failure threshold this run,
          # batched into a single issue when more than one went down
          # together — one label list on one issue rather than a flood of
          # simultaneous separate issues for what's usually one shared
          # root cause (the server itself, DNS, Cloudflare, etc). A lone
          # newly-down app still gets exactly the same single-app issue
          # shape as before.
          newly_down_count=$(echo "$newly_down_json" | jq 'length')
          if [[ "$newly_down_count" -eq 1 ]]; then
            key=$(echo "$newly_down_json" | jq -r '.[0].key')
            url=$(echo "$newly_down_json" | jq -r '.[0].url')
            status=$(echo "$newly_down_json" | jq -r '.[0].status')
            label=$(echo "$newly_down_json" | jq -r '.[0].label')
            gh_retry gh issue create --repo "$GH_REPO" \
              --title "$key is unreachable" \
              --body "Automated check could not reach $url (HTTP $status) as of $(date -u +'%Y-%m-%d %H:%M UTC')." \
              --label "$label" --label auto-outage
            echo "Opened new issue for $key"
          elif [[ "$newly_down_count" -gt 1 ]]; then
            keys=$(echo "$newly_down_json" | jq -r '[.[].key] | join(", ")')
            now_str=$(date -u +'%Y-%m-%d %H:%M UTC')
            body=$(echo "$newly_down_json" | jq -r --arg now "$now_str" \
              '["Automated checks could not reach the following apps as of \($now):", ""] + [.[] | "- \(.key): \(.url) (HTTP \(.status))"] | join("\n")')

            label_flags=(--label auto-outage)
            while IFS= read -r l; do label_flags+=(--label "$l"); done < <(echo "$newly_down_json" | jq -r '.[].label')

            gh_retry gh issue create --repo "$GH_REPO" \
              --title "$keys are unreachable" \
              --body "$body" \
              "${label_flags[@]}"
            echo "Opened new combined issue for: $keys"
          fi

          # Commit monitoring-start.json only when a genuinely new app was
          # seen this run — independent of the latency block below (both
          # are cheap no-ops most runs).
          if [[ "$monitoring_changed" == true ]]; then
            echo "$monitoring_json" > data/monitoring-start.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/monitoring-start.json
            git commit -m "Record monitoring start date for new app(s)"
            git pull --rebase --autostash
            git push
          fi

          # Prune samples older than 90 days and commit only on the one run
          # per hour that actually recorded anything — record_latency stays
          # a plain shell variable (process substitution, not a subshell)
          # so it's still set here from the loop above.
          if [[ "$record_latency" == true ]]; then
            cutoff_epoch=$(date -u -d '-90 days' +%s)
            latency_json=$(echo "$latency_json" | jq --argjson cutoff "$cutoff_epoch" \
              'with_entries(.value |= map(select((.t | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) >= $cutoff)))')
            echo "$latency_json" > data/latency-history.json
            state_json=$(echo "$state_json" | jq --arg h "$current_hour" '._lastLatencyHour = $h')

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/latency-history.json
            if ! git diff --cached --quiet; then
              git commit -m "Record hourly response-time samples ($current_hour)"
              git pull --rebase --autostash
              git push
            fi
          fi

          # Process substitution (< <(...)) runs the while loop in this same
          # shell, not a subshell, so state_json's accumulated updates are
          # still here — write them back once, rather than on every app.
          gh_retry gh issue edit "$state_issue_number" --repo "$GH_REPO" --body "$state_json"
