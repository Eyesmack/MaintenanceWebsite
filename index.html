<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status | Isaac Mason</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f1724 0%, #0b1220 100%);
      }
      .text{
        color: #cbd5e1;
      }
      .footer-text{
        color: #6a7585;
      }
      .home-card {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .sub-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .btn-custom {
        min-width: 220px;
      }
      .logo-img {
        max-width: 280px;
        width: 100%;
        height: auto;
      }
      /* When there's an odd number of app cards, the last one sits alone on
         its row — center it instead of leaving it stuck to the left. */
      #status-cards > .col:nth-last-child(1):nth-child(odd) {
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card home-card shadow-lg p-4 text-center">
            <div class="card-body">
              <img src="logo.png" alt="Undiscovered Land Studios logo" class="logo-img mb-3">
			        <h1 class="text" id="status-heading">Checking status <div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading...</span></div></h1>
              <p class="lead mb-4 text" id="status-subheading">Checking each service, please wait.</p>
              <div class="row row-cols-1 row-cols-sm-2 g-3 mt-4" id="status-cards"></div>
              <div id="recent-updates" class="mt-4 text-start d-none">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                  <h5 class="text mb-0">Recent Updates</h5>
                  <select id="recent-updates-count" class="form-select form-select-sm" style="width: auto;">
                    <option value="5" selected>Last 5</option>
                    <option value="10">Last 10</option>
                  </select>
                </div>
                <div id="recent-updates-list"></div>
              </div>
              <!--
              <div class="d-grid gap-3 d-sm-flex justify-content-center flex-wrap">
                  <a href="https://isaacmason.co.nz" rel="noopener" class="btn btn-outline-light btn-lg btn-custom">Go Back</a>
              </div>
              -->
            </div>
            <div class="card-footer footer-text">
              <small id="last-updated"><p class="card-text placeholder-glow"><span class="placeholder col-4"></span></p></small>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="status.js"></script>
  </body>
</html>
