<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status | Isaac Mason</title>
    <link rel="icon" id="favicon" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-11">
          <div class="card home-card shadow-lg p-4 pt-0 text-center">
            <div class="card-header">
              <small><span class="version-text" id="version-text"><p class="card-text placeholder-glow"><span class="placeholder col-1"></span></p></span></small>
            </div>
            <div class="card-body">
              <img src="logo.png" alt="Undiscovered Land Studios logo" class="logo-img mb-3">
			        <h1 class="text" id="status-heading">Checking status <div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading...</span></div></h1>
              <p class="lead mb-4 text" id="status-subheading">Checking each service, please wait.</p>
              <div class="d-flex justify-content-end align-items-center gap-2 mb-0" id="uptime-timeframe-row"></div>
              <div class="row row-cols-1 row-cols-md-2 g-3 mt-1" id="status-cards"></div>
              <div id="recent-updates" class="mt-4 text-start d-none">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                  <h5 class="text mb-0">Recent Updates (<span><a href="history" class="version-text">Full Incident History</a>)</span></h5>
                  <select id="recent-updates-count" class="form-select form-select-sm" style="width: auto;">
                    <option value="5" selected>Last 5</option>
                    <option value="10">Last 10</option>
                  </select>
                </div>
                <div class="accordion" id="recent-updates-accordion"></div>
              </div>
              <!--
              <div class="d-grid gap-3 d-sm-flex justify-content-center flex-wrap">
                  <a href="https://isaacmason.co.nz" rel="noopener" class="btn btn-outline-light btn-lg btn-custom">Go Back</a>
              </div>
              -->
            </div>
            <div class="card-footer version-text">
              <small id="last-updated"><p class="card-text placeholder-glow"><span class="placeholder col-4"></span></p></small>
              <small> · <a href="history" class="version-text">Incident History</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="common.js"></script>
    <script src="status.js"></script>
  </body>
</html>
