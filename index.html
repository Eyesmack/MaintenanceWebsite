<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CDN | Undiscovered Land Studios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
        color: white;
      }
      .home-card {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .btn-custom {
        min-width: 220px;
      }
      .logo-img {
        max-width: 280px;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card home-card shadow-lg p-4 text-center">
            <div class="card-body">
              <img src="logo.png" alt="Undiscovered Land Studios logo" class="logo-img mb-3">
              <p class="lead mb-4">Welcome to the Undiscovered Land Studios CDN.</p>
              <div class="d-grid gap-3 d-sm-flex justify-content-center flex-wrap">
                  <a href="https://isaacmason.co.nz" rel="noopener" class="btn btn-outline-light btn-lg btn-custom">Go Back</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
