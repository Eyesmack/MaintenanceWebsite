<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App | Isaac Mason</title>
    <link rel="icon" id="favicon" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-11">
          <div class="card home-card shadow-lg p-4 pt-0 text-center">
            <div class="card-header">
              <small><a href="./" class="version-text">&larr; Back to Status</a></small>
            </div>
            <div class="card-body">
              <img src="logo.png" alt="Undiscovered Land Studios logo" class="logo-img mb-3">

              <p class="text" id="app-loading">Loading app status…</p>

              <div id="app-not-found" class="d-none">
                <h1 class="text">App Not Found</h1>
                <p class="lead mb-0 text" id="app-not-found-message">This app could not be found.</p>
              </div>

              <div id="app-found" class="d-none">
                <h1 class="text" id="app-heading">
                  <span id="app-name"></span>
                  <span class="badge rounded-pill bg-secondary" id="app-badge">Checking…</span>
                </h1>
                <p class="lead mb-3 text" id="app-message"></p>

                <div class="text-start">
                  <p class="text small mb-0" id="app-uptime-percent">Calculating…</p>
                  <p class="small text mb-1 mt-2">Uptime History (Last 90 Days)</p>
                  <div class="d-flex gap-1" style="height: 18px;" id="app-uptime-history"></div>

                  <div id="recent-updates" class="mt-4 d-none">
                    <h5 class="text mb-3">Recent Updates</h5>
                    <div class="accordion" id="recent-updates-accordion"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-footer version-text">
              <small id="last-updated"></small>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="common.js"></script>
    <script src="app.js"></script>
  </body>
</html>
